<!DOCTYPE html>

<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Friend Follow</title>

<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Prompt',sans-serif;
}

body{

min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

overflow:hidden;

background:
radial-gradient(circle at top left,#ffd6ea 0%,transparent 30%),
radial-gradient(circle at bottom right,#ffe9f4 0%,transparent 30%),
linear-gradient(180deg,#fff0f7,#fff8fc);

position:relative;

}

/* FLOATING BLOBS */

.blob{

position:absolute;

border-radius:50%;

filter:blur(30px);

opacity:.45;

animation:float 8s infinite ease-in-out;

}

.blob1{
width:260px;
height:260px;
background:#ff9dcf;
top:-80px;
left:-80px;
}

.blob2{
width:320px;
height:320px;
background:#ffd2e7;
bottom:-120px;
right:-100px;
animation-delay:2s;
}

.blob3{
width:180px;
height:180px;
background:#ffc1dc;
top:40%;
right:10%;
animation-delay:4s;
}

@keyframes float{

0%{
transform:translateY(0px);
}

50%{
transform:translateY(-20px);
}

100%{
transform:translateY(0px);
}

}

/* CARD */

.card{

width:90%;
max-width:520px;

padding:40px 30px;

border-radius:40px;

background:
linear-gradient(
180deg,
rgba(255,255,255,.96),
rgba(255,248,252,.90)
);

backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,.8);

box-shadow:
0 25px 60px rgba(255,105,180,.15),
0 10px 25px rgba(255,182,193,.12);

position:relative;
z-index:2;

text-align:center;

animation:cardFloat 5s infinite ease-in-out;

}

@keyframes cardFloat{

0%{
transform:translateY(0px);
}

50%{
transform:translateY(-8px);
}

100%{
transform:translateY(0px);
}

}

/* LOGO */

.logo{

width:140px;
height:140px;

margin:auto;
margin-bottom:25px;

border-radius:35px;

overflow:hidden;

padding:6px;

background:white;

box-shadow:
0 15px 35px rgba(255,105,180,.18);

}

.logo img{

width:100%;
height:100%;

object-fit:cover;

border-radius:28px;

}

/* TITLE */

.title{

font-size:58px;

font-weight:800;

line-height:1;

margin-bottom:12px;

background:
linear-gradient(
180deg,
#ff69b4,
#ff1493
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

}

.sub{

font-size:16px;

line-height:1.8;

color:#777;

margin-bottom:35px;

}

/* BUTTON */

.enterBtn{

display:inline-flex;
align-items:center;
justify-content:center;
gap:12px;

width:100%;
height:74px;

border:none;

border-radius:26px;

background:
linear-gradient(
135deg,
#ff77ba,
#ff1493
);

color:white;

font-size:24px;
font-weight:800;

text-decoration:none;

box-shadow:
0 20px 40px rgba(255,20,147,.25);

transition:.25s;

position:relative;

overflow:hidden;

}

.enterBtn::before{

content:"";

position:absolute;

top:0;
left:-120%;

width:80%;
height:100%;

background:
linear-gradient(
90deg,
transparent,
rgba(255,255,255,.45),
transparent
);

transform:skewX(-25deg);

animation:shine 3s infinite;

}

@keyframes shine{

0%{
left:-120%;
}

100%{
left:140%;
}

}

.enterBtn:hover{

transform:translateY(-4px) scale(1.02);

box-shadow:
0 28px 50px rgba(255,20,147,.30);

}

/* FOOTER */

.footer{

margin-top:28px;

font-size:14px;

line-height:1.8;

color:#888;

}

/* MOBILE */

@media(max-width:600px){

.title{
font-size:46px;
}

.enterBtn{
font-size:20px;
height:68px;
}

}

</style>

</head>

<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>

<div class="card">

<div class="logo">
<img src="https://drive.google.com/thumbnail?id=1MkcMeownluKirO8ydpML31gGm93kMV0i">
</div>

<div class="title">
Friend Follow
</div>

<div class="sub">
ระบบตรวจสอบออเดอร์อัตโนมัติ<br>
ตรวจสอบสถานะได้ตลอด 24 ชั่วโมง
</div>

<a
class="enterBtn"
href="https://script.google.com/macros/s/AKfycbxSQWvc8793YnSnzJFK6SVnIYZd4vZBT0eYMWUb13LcUUX56rPnNNXkvxpT-nsle4GW/exec?page=check"
target="_blank"

>

💖 ตรวจสอบสถานะออเดอร์ </a>

<div class="footer">
Friend Follow Payment System<br>
Secure • Fast • Automatic
</div>

</div>

</body>
</html>
